service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: Baseline CP1 có latency P95 khoảng 151ms và TTFT P95 khoảng 50ms. Ngưỡng 3000ms giữ dư địa cho tải thực tế nhưng vẫn phát hiện request chậm ảnh hưởng trực tiếp tới người dùng.
  note: SLO 99.5% trong 28 ngày cho phép error budget 0.5%. Với 10,000 request trong cửa sổ, tối đa 50 request được phép lỗi hoặc có latency lớn hơn 3000ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
